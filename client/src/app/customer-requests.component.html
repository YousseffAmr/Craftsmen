<div class="profile-page"><header class="topbar"><div class="container app-shell d-flex align-items-center justify-content-between py-3"><a routerLink="/customer/craftsmen" class="brand d-flex align-items-center gap-2 text-decoration-none"><span class="brand-badge d-inline-flex align-items-center justify-content-center rounded-circle"><i class="bi bi-hammer"></i></span><span class="brand-name">CraftConnect</span></a><nav class="d-flex gap-2"><a routerLink="/customer/notifications" class="nav-link">Notifications</a><a routerLink="/customer/profile" class="nav-link">Profile</a></nav></div></header><main class="container app-shell py-4"><h1 class="page-title mb-4">My requests</h1><div *ngIf="loading()" class="state">Loading requests...</div><div *ngIf="!loading() && errorMessage()" class="state error">{{errorMessage()}}</div><div *ngIf="!loading() && !errorMessage() && requests().length===0" class="state empty">No requests yet.</div><section *ngFor="let request of requests()" class="profile-card rounded-4 p-4 mb-3"><div class="d-flex justify-content-between gap-3"><div><p class="eyebrow mb-1">{{request.craftName}}</p><h2 class="section-title mb-1">{{request.craftsmanName}}</h2><span class="text-muted">{{request.neededOn | date:'mediumDate'}} · {{request.price | number:'1.2-2'}}</span></div><span class="status-badge rounded-pill px-3 py-2">{{request.status}}</span></div><button *ngIf="request.status==='Pending'" class="btn btn-outline-danger btn-sm mt-3" type="button" [disabled]="actionId()!==null" (click)="withdraw(request)">Withdraw request</button></section></main></div>
