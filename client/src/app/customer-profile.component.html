<div class="profile-page"><header class="topbar"><div class="container app-shell d-flex align-items-center justify-content-between py-3"><a routerLink="/customer/craftsmen" class="brand d-flex align-items-center gap-2 text-decoration-none"><span class="brand-badge d-inline-flex align-items-center justify-content-center rounded-circle"><i class="bi bi-hammer"></i></span><span class="brand-name">{{ 'CraftConnect' | translate }}</span></a><span class="user-pill rounded-pill px-3 py-2"><i class="bi bi-person-circle me-2"></i>{{ 'Customer' | translate }}</span></div></header><main class="container app-shell py-4 py-lg-5"><section class="profile-card rounded-4 p-4 p-lg-5"><p class="eyebrow mb-2">{{ 'Your details' | translate }}</p><h1 class="page-title mb-4">{{ 'Customer profile' | translate }}</h1><div *ngIf="loading()" class="state">{{ 'Loading profile...' | translate }}</div><div *ngIf="!loading() && errorMessage()" class="state error" role="alert">{{errorMessage() | translate }}</div><form *ngIf="!loading() && profile()" (ngSubmit)="save()"><div class="mb-3"><label class="form-label" for="customer-name">{{ 'Name' | translate }}</label><input id="customer-name" name="name" class="form-control" dir="auto" [(ngModel)]="form.name"></div><div class="mb-4"><label class="form-label" for="customer-contact">{{ 'Contact information' | translate }}</label><textarea id="customer-contact" name="contactInfo" class="form-control" dir="auto" rows="3" [(ngModel)]="form.contactInfo"></textarea></div><button class="btn btn-primary" type="submit" [disabled]="saving()">{{ (saving() ? 'Saving...' : 'Save profile') | translate }}</button><div *ngIf="successMessage()" class="state success mt-3">{{successMessage() | translate }}</div><div *ngIf="errorMessage()" class="state error mt-3" role="alert">{{errorMessage() | translate }}</div></form></section></main></div>
