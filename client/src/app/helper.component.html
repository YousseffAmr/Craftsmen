<ng-container *ngIf="authService.hasToken()"><button class="helper-toggle" type="button" (click)="open.set(!open())" aria-label="Open helper"><i class="bi bi-question-circle"></i></button><section *ngIf="open()" class="helper-panel"><div class="d-flex justify-content-between align-items-center mb-2"><strong>CraftConnect helper</strong><button type="button" class="btn-close" aria-label="Close helper" (click)="open.set(false)"></button></div><textarea class="form-control mb-2" rows="2" placeholder="How can we help?" [(ngModel)]="question"></textarea><button class="btn btn-primary btn-sm" type="button" [disabled]="loading()" (click)="ask()">{{loading()?'Asking...':'Ask'}}</button><p *ngIf="response()" class="small mt-3 mb-0">{{response()?.answer}} <a *ngIf="response()?.link" [routerLink]="response()?.link">Open</a></p><p *ngIf="errorMessage()" class="small text-danger mt-2 mb-0">{{errorMessage()}}</p></section></ng-container>
