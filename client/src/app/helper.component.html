<ng-container *ngIf="authService.hasToken()"><button class="helper-toggle" type="button" (click)="open.set(!open())" [attr.aria-label]="'Open helper' | translate"><i class="bi bi-question-circle"></i></button><section *ngIf="open()" class="helper-panel"><div class="d-flex justify-content-between align-items-center mb-2"><strong>{{ 'CraftConnect helper' | translate }}</strong><button type="button" class="btn-close" [attr.aria-label]="'Close helper' | translate" (click)="open.set(false)"></button></div><textarea class="form-control mb-2" rows="2" [placeholder]="'How can we help?' | translate" [(ngModel)]="question"></textarea><button class="btn btn-primary btn-sm" type="button" [disabled]="loading()" (click)="ask()">{{ (loading() ? 'Asking...' : 'Ask') | translate }}</button><p *ngIf="response()" class="small mt-3 mb-0" dir="auto">{{ response()?.answer }}
<p *ngIf="errorMessage()" class="small text-danger mt-2 mb-0">{{ errorMessage() | translate }}</p></section></ng-container>
